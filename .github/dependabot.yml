version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    open-pull-requests-limit: 10

  # Maintain root & workspace npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-backend)"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-frontend)"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/services/notification-service"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-notification)"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/services/queue-service"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-queue)"
    open-pull-requests-limit: 10

  # Maintain Dockerfile base images
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker-backend)"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker-frontend)"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/services/notification-service"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker-notification)"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/services/queue-service"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker-queue)"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker-migrate)"
    open-pull-requests-limit: 5
