name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-unit:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build internal packages
        run: |
          npm --prefix packages/contracts run build
          npm --prefix packages/common run build
          npm --prefix packages/messaging run build

      - name: Lint Frontend
        run: npm --prefix frontend run lint

      - name: Unit Tests - Contracts
        run: npm --prefix packages/contracts test

      - name: Unit Tests - Common
        run: npm --prefix packages/common test

      - name: Unit Tests - Messaging
        run: npm --prefix packages/messaging test

      - name: Unit Tests - Notification Service
        run: npm --prefix services/notification-service test

      - name: Unit Tests - Queue Service
        run: npm --prefix services/queue-service test

      - name: Unit Tests - Backend Monolith
        run: npm --prefix backend test

      - name: Unit Tests - Frontend
        run: npm --prefix frontend test

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: queueless
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build internal packages
        run: |
          npm --prefix packages/contracts run build
          npm --prefix packages/common run build
          npm --prefix packages/messaging run build

      - name: Setup Service Databases & Migrations
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          DB_HOST: localhost
          DB_PORT: 5432
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/queueless
          ADMIN_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/postgres
          NOTIFICATION_DB_USER: notification_user
          NOTIFICATION_DB_PASSWORD: notification_password
          NOTIFICATION_DB_NAME: notification_db
          NOTIFICATION_DATABASE_URL: postgresql://notification_user:notification_password@localhost:5432/notification_db
          QUEUE_DB_USER: queue_user
          QUEUE_DB_PASSWORD: queue_password
          QUEUE_DB_NAME: queue_db
          QUEUE_DATABASE_URL: postgresql://queue_user:queue_password@localhost:5432/queue_db
          INTERNAL_TOKEN: queueless-internal-gateway-secret-key-32ch
          JWT_ACCESS_SECRET: queueless_super_secret_access_token_key_change_in_production_123456
          JWT_REFRESH_SECRET: queueless_super_secret_refresh_token_key_change_in_production_789012
        run: |
          npm run db:create-service-dbs
          npm run migrate
          npm run migrate:notification
          npm run migrate:queue

      - name: Run Backend Integration Suite
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/queueless
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          RABBITMQ_URL: amqp://guest:guest@localhost:5672
          INTERNAL_TOKEN: queueless-internal-gateway-secret-key-32ch
          JWT_ACCESS_SECRET: queueless_super_secret_access_token_key_change_in_production_123456
          JWT_REFRESH_SECRET: queueless_super_secret_refresh_token_key_change_in_production_789012
          QUEUE_MODE: embedded
          SOCKET_MODE: embedded
        run: npm --prefix backend test

  gateway-lint:
    name: Gateway Configuration Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Nginx Config with envsubst
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/gateway/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "${{ github.workspace }}/gateway/templates:/etc/nginx/templates:ro" \
            nginx:1.26-alpine sh -c "export BACKEND_UPSTREAM=127.0.0.1:5000 NOTIFICATION_UPSTREAM=127.0.0.1:3004 QUEUE_UPSTREAM=127.0.0.1:3003 FRONTEND_UPSTREAM=127.0.0.1:80 INTERNAL_TOKEN=ci-token && envsubst '\$BACKEND_UPSTREAM \$NOTIFICATION_UPSTREAM \$QUEUE_UPSTREAM \$FRONTEND_UPSTREAM \$INTERNAL_TOKEN' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -t"

  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build internal packages
        run: |
          npm --prefix packages/contracts run build
          npm --prefix packages/common run build
          npm --prefix packages/messaging run build

      - name: Build Backend
        run: npm run build:backend

      - name: Build Frontend
        run: npm run build:frontend

  docker:
    name: Container Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [lint-and-unit, integration, gateway-lint, build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build Core Image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: queueless-core:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Core Image with Trivy
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: queueless-core:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Build Frontend Image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: queueless-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Frontend Image with Trivy
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: queueless-frontend:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Build Notification Service Image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: services/notification-service/Dockerfile
          push: false
          load: true
          tags: queueless-notification-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Notification Service Image with Trivy
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: queueless-notification-service:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Build Queue Service Image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: services/queue-service/Dockerfile
          push: false
          load: true
          tags: queueless-queue-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Queue Service Image with Trivy
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: queueless-queue-service:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
