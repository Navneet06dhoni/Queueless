services:
  core:
    container_name: queueless_core_1
    environment:
      QUEUE_MODE: embedded
      SOCKET_MODE: embedded
      NOTIFICATIONS_MODE: embedded
      RATE_LIMIT_GLOBAL_MAX: ${RATE_LIMIT_GLOBAL_MAX:-1000}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  core-2:
    image: queueless-core:latest
    container_name: queueless_core_2
    restart: unless-stopped
    networks:
      - backend
    environment:
      NODE_ENV: production
      PORT: 5000
      API_PREFIX: /api
      FRONTEND_URL: http://localhost:8080
      FRONTEND_ORIGIN: "http://localhost:8080"
      TRUST_PROXY: "1"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-queueless}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_REFRESH_EXPIRES_IN: 7d
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASS: ""
      EMAIL_FROM: "QueueLess Alerts <no-reply@queueless.local>"
      BUSINESS_TIMEZONE: Asia/Kolkata
      NOTIFICATIONS_ENABLED: "true"
      NOTIFICATIONS_MODE: embedded
      QUEUE_MODE: embedded
      SOCKET_MODE: embedded
      RATE_LIMIT_GLOBAL_MAX: ${RATE_LIMIT_GLOBAL_MAX:-1000}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/health/live | grep ok || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  core-3:
    image: queueless-core:latest
    container_name: queueless_core_3
    restart: unless-stopped
    networks:
      - backend
    environment:
      NODE_ENV: production
      PORT: 5000
      API_PREFIX: /api
      FRONTEND_URL: http://localhost:8080
      FRONTEND_ORIGIN: "http://localhost:8080"
      TRUST_PROXY: "1"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-queueless}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_REFRESH_EXPIRES_IN: 7d
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASS: ""
      EMAIL_FROM: "QueueLess Alerts <no-reply@queueless.local>"
      BUSINESS_TIMEZONE: Asia/Kolkata
      NOTIFICATIONS_ENABLED: "true"
      NOTIFICATIONS_MODE: embedded
      QUEUE_MODE: embedded
      SOCKET_MODE: embedded
      RATE_LIMIT_GLOBAL_MAX: ${RATE_LIMIT_GLOBAL_MAX:-1000}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/health/live | grep ok || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  queue-service:
    profiles: ["disabled"]
    deploy:
      replicas: 0

  notification-service:
    profiles: ["disabled"]
    deploy:
      replicas: 0

  gateway:
    depends_on:
      frontend:
        condition: service_healthy
      core:
        condition: service_healthy
      core-2:
        condition: service_healthy
      core-3:
        condition: service_healthy
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/monolith-x3.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN is required}
      GATEWAY_AUTH_RATE_LIMIT: ${GATEWAY_AUTH_RATE_LIMIT:-5r/m}
      GATEWAY_API_RATE_LIMIT: ${GATEWAY_API_RATE_LIMIT:-20r/s}
      GATEWAY_AUTH_BURST: ${GATEWAY_AUTH_BURST:-2}
      GATEWAY_API_BURST: ${GATEWAY_API_BURST:-10}
      NGINX_ENVSUBST_FILTER: "INTERNAL_TOKEN|GATEWAY_AUTH_RATE_LIMIT|GATEWAY_API_RATE_LIMIT|GATEWAY_AUTH_BURST|GATEWAY_API_BURST"
