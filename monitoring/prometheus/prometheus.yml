global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: core
    metrics_path: /metrics
    static_configs:
      - targets: ['core:5000']

  - job_name: queue-service
    metrics_path: /metrics
    static_configs:
      - targets: ['queue-service:3003']

  - job_name: notification-service
    metrics_path: /metrics
    static_configs:
      - targets: ['notification-service:3004']

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: nginx-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['nginx-exporter:9113']
